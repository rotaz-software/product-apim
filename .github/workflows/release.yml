name: Release

on:
  push:
    tags: ['*-rotaz-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build release artifact
        run: mvn clean install -DskipTests -q --file all-in-one-apim/pom.xml

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Extract section for this tag from ROTAZ_CHANGELOG.md
          awk "/^## \[$TAG\]/,/^## \[/" ROTAZ_CHANGELOG.md \
            | head -n -1 \
            > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-in-one-apim/modules/distribution/product/target/*.zip
          body_path: ${{ steps.changelog.outputs.notes_file }}
          generate_release_notes: false
          make_latest: true