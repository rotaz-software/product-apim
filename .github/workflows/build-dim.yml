name: Build DIM

on:
  push:
    branches: ['rotaz/**']
  pull_request:
    branches: ['rotaz/main']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean install -DskipTests -T 2 --no-transfer-progress --file all-in-one-apim/pom.xml

      - name: Test
        run: mvn test -T 2 --no-transfer-progress --file all-in-one-apim/pom.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-apim-rotaz-${{ github.ref_name }}
          path: all-in-one-apim/modules/distribution/product/target/*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Build DIM falhou em ${{ github.ref_name }} — ver logs acima"
          echo "## ❌ Build falhou" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY

      - name: Trigger DIM Builder
        if: github.ref_name == 'rotaz/main' && github.event_name == 'push' && success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DIM_BUILDER_PAT }}
          repository: rotaz-software/dim-builder
          event-type: fork-build-ready
          client-payload: |
            {
              "branch": "${{ github.ref_name }}",
              "version": "4.7.0",
              "sha": "${{ github.sha }}"
            }