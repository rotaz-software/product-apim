name: Build DIM

on:
  push:
    branches: ['rotaz/**']
  pull_request:
    branches: ['rotaz/main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean install -DskipTests -q --file all-in-one-apim/pom.xml

      - name: Test
        run: mvn test -q --file all-in-one-apim/pom.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-apim-rotaz-${{ github.ref_name }}
          path: all-in-one-apim/modules/distribution/product/target/*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Trigger DIM Builder
        if: github.ref_name == 'rotaz/main' && github.event_name == 'push'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DIM_BUILDER_PAT }}
          repository: rotaz-software/dim-builder
          event-type: fork-build-ready
          client-payload: |
            {
              "branch": "${{ github.ref_name }}",
              "version": "4.7.0",
              "sha": "${{ github.sha }}"
            }